name: pawmap-local

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: pawmap
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pawmap-postgres:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d pawmap']
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      pawmap.project: pawmap-local

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - '127.0.0.1:8025:8025'
    labels:
      pawmap.project: pawmap-local

  nginx:
    image: nginx:1.28-bookworm
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - pawmap-nginx-config:/etc/nginx/conf.d:ro
    labels:
      pawmap.project: pawmap-local

volumes:
  pawmap-postgres:
    labels:
      pawmap.project: pawmap-local
  pawmap-nginx-config:
    name: pawmap-nginx-config
    external: true
