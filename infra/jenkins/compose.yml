name: pawmap-jenkins
services:
  jenkins-home-init:
    image: pawmap-jenkins-controller:local
    user: '0:0'
    entrypoint: ['/bin/sh', '-c']
    command: ['chown -R 1000:1000 /var/jenkins_home']
    volumes:
      - /var/jenkins_home:/var/jenkins_home
    labels:
      pawmap.project: pawmap-jenkins

  jenkins:
    image: pawmap-jenkins-controller:local
    build:
      context: .
    depends_on:
      jenkins-home-init:
        condition: service_completed_successfully
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_config/jenkins.yaml
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:?JENKINS_ADMIN_ID is required}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?JENKINS_ADMIN_PASSWORD is required}
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    group_add:
      - '996'
    ports:
      - '127.0.0.1:8080:8080'
      - '127.0.0.1:50000:50000'
    volumes:
      - /var/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /workspace:/workspace:ro
      - ./jenkins.yaml:/var/jenkins_config/jenkins.yaml:ro
    labels:
      pawmap.project: pawmap-jenkins
