services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: pawmap_test
      POSTGRES_USER: ${CI_DB_USER:?CI_DB_USER is required}
      POSTGRES_PASSWORD: ${CI_DB_PASSWORD:?CI_DB_PASSWORD is required}
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d pawmap_test']
      interval: 3s
      timeout: 2s
      retries: 30
    labels:
      pawmap.project: pawmap-ci
  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - '58025:8025'
    labels:
      pawmap.project: pawmap-ci
