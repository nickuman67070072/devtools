server {
  listen 3000;
  server_name _;
  default_type application/json;

  location = /api/health/ready {
    add_header X-PawMap-Release smoke-fixture always;
    if ($host ~ "^app-(blue|green)$") {
      return 200 '{"status":"ready","fixture":"direct-only"}';
    }
    return 503 '{"status":"not-ready","fixture":"proxy-smoke"}';
  }
}
